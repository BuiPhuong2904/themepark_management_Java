<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập - Công viên ABC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">🎢 Công viên ABC</a>
    </div>
  </nav>

  <!-- Form đăng nhập -->
  <div class="container py-5">
    <h2 class="text-center mb-4">Đăng nhập</h2>
    <form>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label for="matKhau" class="form-label">Mật khẩu</label>
        <input type="password" class="form-control" id="matKhau" required>
      </div>
      <button type="submit" class="btn btn-success">Đăng nhập</button>
      <p class="mt-3">Chưa có tài khoản? <a href="dangky.html">Đăng ký ngay</a></p>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
